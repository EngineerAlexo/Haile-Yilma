<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | Haile Yilma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #authStatus { margin: 14px 0 6px; font-size: 0.875rem; text-align: center; min-height: 20px; font-weight: 500; color: #ef4444; }
    </style>
</head>
<body class="auth-page">
    <main class="auth-layout">
        <a class="brand auth-brand" href="index.html">
            <span class="brand-mark">H</span>
            <span>Haile Yilma</span>
        </a>

        <div class="auth-decoration decor-a"></div>
        <div class="auth-decoration decor-b"></div>

        <section class="auth-card">
            <div class="auth-logo"><span class="brand-mark">H</span> Haile Yilma</div>
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your portfolio admin account</p>

            <form id="loginForm">
                <label>Email Address
                    <input name="email" type="email" placeholder="you@example.com" required autocomplete="username">
                </label>

                <label>Password
                    <input name="password" type="password" placeholder="Enter your password" required autocomplete="current-password" minlength="6">
                </label>

                <div id="authStatus" aria-live="polite"></div>

                <button class="button button-primary auth-submit" type="submit">Sign In</button>
            </form>

            <div class="auth-divider"><span>SECURE ADMIN ACCESS</span></div>
            <a class="text-link" href="index.html">← Back to portfolio</a>
        </section>
    </main>

    <script type="module" src="js/firebase.js"></script>
</body>
</html>
